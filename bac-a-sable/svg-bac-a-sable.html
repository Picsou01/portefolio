<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bac à sable SVG</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: system-ui, sans-serif;
        background: #0d0d12;
        color: #e8e8ed;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        gap: 1rem;
    }
    h1 { font-size: 1.2rem; color: #8a8a99; }

    /* La zone de dessin. Le fond et la grille t'aident à te repérer. */
    svg {
        width: 500px;
        height: 500px;
        max-width: 90vw;
        background:
            linear-gradient(#1a1a24 1px, transparent 1px) 0 0 / 50px 50px,
            linear-gradient(90deg, #1a1a24 1px, transparent 1px) 0 0 / 50px 50px,
            #0a0a0f;
        border-radius: 12px;
        border: 1px solid #26262f;
    }

    /* ====== TES ANIMATIONS CSS ICI ====== */
    .mon-anim {
        transform-origin: center;
        animation: exemple 2s ease-in-out infinite;
    }
    @keyframes exemple {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.3); }
    }
</style>
</head>
<body>

<h1>Bac à sable — grille de 50px. Dessine et expérimente librement.</h1>

<!-- viewBox 500x500 = chaque case de la grille fait 50 unités -->
<svg viewBox="0 0 500 500">

    <!-- ============================================
         ZONE DE TEST : remplace tout ce qui suit
         par tes propres formes et expériences.
         ============================================ -->

    <circle class="mon-anim" cx="250" cy="250" r="60" fill="#00d9ff"/>

    <!-- Exemples à décommenter et bidouiller :

    <rect x="100" y="100" width="100" height="100" rx="10" fill="#ff006e"/>

    <path d="M 250 100 L 400 400 L 100 400 Z" fill="#ffbe0b"/>

    <line x1="0" y1="0" x2="500" y2="500" stroke="#8338ec" stroke-width="4"/>

    -->

</svg>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // ====== TON JAVASCRIPT ICI ======
        console.log('Bac à sable prêt');
    });
</script>

</body>
</html>
